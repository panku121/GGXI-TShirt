<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Intruders T-Shirt Form</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dv1hqflm2/image/upload/v1785938911/RoyalIntrudersNewLogo_rhzsmx.png">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <section class="neon-card neon-card--start" id="mainCard">
        <div id="startHero" class="start-hero">
            <button type="button" class="hero-banner" id="logoPreviewBtn" aria-label="View Royal Intruders team photo full size">
                <img
                    src="https://res.cloudinary.com/dv1hqflm2/image/upload/v1785938993/RoyalIntrudersWinner_ljvjsg.png"
                    alt="Royal Intruders Winner team"
                >
                <!-- <div class="hero-overlay">
                    <span class="hero-badge">Official Squad · Winner Spirit</span>
                    <span class="hero-banner__hint">Tap to view full photo</span>
                </div> -->
            </button>

            <div class="start-copy">
                <div class="start-crest">
                    <img
                        src="https://res.cloudinary.com/dv1hqflm2/image/upload/v1785938911/RoyalIntrudersNewLogo_rhzsmx.png"
                        alt=""
                        aria-hidden="true"
                    >
                </div>
                <p class="start-kicker">Royal Intruders</p>
                <h1 class="start-title">Jersey Registration</h1>
                <p class="start-tagline">Register your name, size, and jersey number.</p>
            </div>
        </div>

        <div id="formBrand" class="form-brand" hidden>
            <div class="brand-logo-wrap" id="brandLogoWrap">
                <img
                    class="brand-logo"
                    src="https://res.cloudinary.com/dv1hqflm2/image/upload/v1785938911/RoyalIntrudersNewLogo_rhzsmx.png"
                    alt="Royal Intruders Logo"
                >
                <span class="kids-badge-chip" id="kidsBadgeChip" hidden>Kids Mode</span>
            </div>
            <h1 class="form-title" id="formPageTitle">T-Shirt Form</h1>
        </div>

        <div id="typePicker" class="type-picker">
            <div class="picker-head">
                <span class="picker-line" aria-hidden="true"></span>
                <p class="subtitle">Who is this jersey for?</p>
                <span class="picker-line" aria-hidden="true"></span>
            </div>
            <div class="type-options">
                <button type="button" class="type-card type-card--kids" data-form-type="Kids" id="selectKids">
                    <span class="type-card__icon" aria-hidden="true">
                        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="32" cy="32" r="30" fill="url(#kidsBg)" opacity="0.95"/>
                            <path d="M20 28c0-7 5.4-12 12-12s12 5 12 12v2.5l4 3.2v6.3l-4 1.2V48c0 2.2-1.8 4-4 4H24c-2.2 0-4-1.8-4-4v-7.8l-4-1.2v-6.3l4-3.2V28z" fill="#1a5fd4"/>
                            <path d="M24 22.5h16v5.5c0 2.5-2 4.5-4.5 4.5h-7c-2.5 0-4.5-2-4.5-4.5v-5.5z" fill="#3ecfff"/>
                            <path d="M28.5 24.2h7v2.2h-7z" fill="#fff" opacity="0.85"/>
                            <circle cx="18" cy="16" r="2.2" fill="#f5c742"/>
                            <circle cx="46" cy="14" r="1.8" fill="#ff8fd0"/>
                            <circle cx="48" cy="42" r="1.6" fill="#7dffb3"/>
                            <path d="M32 9l1.1 2.4 2.6.4-1.9 1.8.5 2.5L32 14.8 29.7 16l.5-2.5-1.9-1.8 2.6-.4L32 9z" fill="#f5c742"/>
                            <defs>
                                <linearGradient id="kidsBg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#2d6dff"/>
                                    <stop offset="1" stop-color="#1a3d8f"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </span>
                    <span class="type-card__body">
                        <span class="type-card__title">For Kids</span>
                        <span class="type-card__desc">Age and kids size. Phone number not required.</span>
                        <span class="type-card__cta">Continue →</span>
                    </span>
                    <span class="type-card__sparkle type-card__sparkle--one"></span>
                    <span class="type-card__sparkle type-card__sparkle--two"></span>
                </button>
                <button type="button" class="type-card type-card--adult" data-form-type="Adult" id="selectAdult">
                    <span class="type-card__icon type-card__icon--adult" aria-hidden="true">
                        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="32" cy="32" r="30" fill="url(#adultBg)"/>
                            <path d="M18 30c0-6.8 5.6-12.5 14-12.5S46 23.2 46 30v2l5 4v7l-5 1.5V49c0 2.2-1.8 4-4 4H23c-2.2 0-4-1.8-4-4v-4.5l-5-1.5v-7l5-4v-2z" fill="#0f3d8c"/>
                            <path d="M23 23h18v6c0 2.8-2.2 5-5 5H28c-2.8 0-5-2.2-5-5v-6z" fill="#3ecfff"/>
                            <path d="M29 25h6v2.4h-6z" fill="#fff" opacity="0.85"/>
                            <path d="M32 11l1.2 2.6 2.8.4-2 2 .5 2.8L32 17.2 29.5 19l.5-2.8-2-2 2.8-.4L32 11z" fill="#f5c742"/>
                            <defs>
                                <linearGradient id="adultBg" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#17488f"/>
                                    <stop offset="1" stop-color="#0a234f"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </span>
                    <span class="type-card__body">
                        <span class="type-card__title">Self / Adult</span>
                        <span class="type-card__desc">Phone number and full adult size chart.</span>
                        <span class="type-card__cta">Continue →</span>
                    </span>
                </button>
            </div>
            <p class="start-foot-note">Secure · Mobile optimized · Official team registration</p>
        </div>

        <form id="mnsKingsForm" class="form-panel" novalidate hidden>
            <div class="form-topbar">
                <button type="button" class="back-btn" id="backToPicker">← Back</button>
                <span class="form-type-badge" id="formTypeBadge">Adult</span>
            </div>
            <p class="subtitle" id="formSubtitle">Please complete all required fields.</p>

            <input type="hidden" id="formType" name="formType" value="">

            <div class="field">
                <label for="playerName" id="playerNameLabel">Player Name</label>
                <input type="text" id="playerName" name="playerName" placeholder="Enter player name" maxlength="50" autocomplete="off" required>
                <div class="error" id="playerNameError"></div>
            </div>

            <div class="field" id="phoneField">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="10-digit phone number" maxlength="10">
                <div class="error" id="phoneNumberError"></div>
            </div>

            <div class="field" id="kidsAgeField" hidden>
                <label for="kidsAge">Child Age</label>
                <input type="number" id="kidsAge" name="kidsAge" placeholder="Age in years" min="1" max="16" inputmode="numeric">
                <div class="error" id="kidsAgeError"></div>
            </div>

            <div class="field">
                <label for="nameOnTshirt">Name on T-Shirt</label>
                <input type="text" id="nameOnTshirt" name="nameOnTshirt" placeholder="PRINT NAME ON JERSEY" maxlength="15" required>
                <div class="error" id="nameOnTshirtError"></div>
            </div>

            <div class="field" id="adultSizeField">
                <label for="tshirtSize">T-Shirt Size</label>
                <select id="tshirtSize" name="tshirtSize">
                    <option value="">Select size</option>
                    <option value="36/S">36/S</option>
                    <option value="38/M">38/M</option>
                    <option value="40/L">40/L</option>
                    <option value="42/XL">42/XL</option>
                    <option value="44/XXL">44/XXL</option>
                    <option value="46/3XL">46/3XL</option>
                    <option value="48/4XL">48/4XL</option>
                </select>
                <div class="error" id="tshirtSizeError"></div>
            </div>

            <div class="field" id="kidsSizeField" hidden>
                <label for="kidsTshirtSize">Kids T-Shirt Size</label>
                <select id="kidsTshirtSize" name="kidsTshirtSize">
                    <option value="">Select kids size</option>
                    <option value="24 (2-4 yrs)">24 (2-4 yrs)</option>
                    <option value="26 (4-6 yrs)">26 (4-6 yrs)</option>
                    <option value="28 (6-8 yrs)">28 (6-8 yrs)</option>
                    <option value="30-32 (8-12 yrs)">30-32 (8-12 yrs)</option>
                </select>
                <div class="error" id="kidsTshirtSizeError"></div>
            </div>

            <div class="field">
                <label for="numberOnBack">Number on Back</label>
                <input type="text" id="numberOnBack" name="numberOnBack" placeholder="e.g. 001, 07, 700" inputmode="numeric" maxlength="3" autocomplete="off" required>
                <div class="error" id="numberOnBackError"></div>
            </div>

            <div class="field" id="sleeveField">
                <label for="sleeveLength">Sleeve Length</label>
                <select id="sleeveLength" name="sleeveLength">
                    <option value="">Select sleeve length</option>
                    <option value="Half Sleeve">Half Sleeve</option>
                    <option value="Full Sleeve">Full Sleeve</option>
                </select>
                <div class="error" id="sleeveLengthError"></div>
            </div>

            <div class="actions">
                <button id="submitBtn" type="submit">Submit Registration</button>
            </div>
            <div class="status" id="statusMessage"></div>
        </form>
    </section>

    <div class="image-lightbox" id="imageLightbox" hidden>
        <div class="image-lightbox__backdrop" id="lightboxBackdrop"></div>
        <div class="image-lightbox__content">
            <button type="button" class="image-lightbox__close" id="lightboxClose" aria-label="Close full view">&times;</button>
            <img
                src="https://res.cloudinary.com/dv1hqflm2/image/upload/v1785938993/RoyalIntrudersWinner_ljvjsg.png"
                alt="Royal Intruders team full view"
                id="lightboxImage"
            >
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
